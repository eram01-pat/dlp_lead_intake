# Negative keywords — a match on any of these suppresses or downgrades a tender.
#
# !! CONFIRM WITH CMW BEFORE GOING LIVE !!
# Some entries (e.g. "window cleaning", "floor cleaning") are ambiguous.
# CMW must decide their scope boundaries before this list is trusted in production.
#
# action:
#   suppress  — remove the match entirely (unambiguous out-of-scope)
#   downgrade — reduce confidence by one band (ambiguous; human review warranted)

disqualifiers:

  # Clearly out-of-scope (suppress)
  - {term: "interior detailing",    action: suppress}
  - {term: "car detailing",         action: suppress}
  - {term: "auto detailing",        action: suppress}
  - {term: "upholstery",            action: suppress}
  - {term: "carpet cleaning",       action: suppress}
  - {term: "dry cleaning",          action: suppress}
  - {term: "laundry",               action: suppress}
  - {term: "janitorial",            action: suppress}
  - {term: "office cleaning",       action: suppress}
  - {term: "window cleaning",       action: suppress, notes: "CONFIRM WITH CMW — may be in scope for some jobs"}
  - {term: "snow removal",          action: suppress}
  - {term: "snow plowing",          action: suppress}
  - {term: "landscaping",           action: suppress}
  - {term: "grounds maintenance",   action: suppress}
  - {term: "HVAC",                  action: suppress}
  - {term: "duct cleaning",         action: suppress}
  - {term: "IT services",           action: suppress}
  - {term: "software",              action: suppress}
  - {term: "data cleansing",        action: suppress}
  - {term: "data cleaning",         action: suppress}
  - {term: "catering",              action: suppress}
  - {term: "security guard",        action: suppress}
  - {term: "waste collection",      action: suppress}
  - {term: "septic",                action: suppress}

  # Ambiguous — downgrade but don't suppress
  - {term: "medical",               action: downgrade, notes: "sanitizing/disinfection in medical context is not CMW scope"}
  - {term: "dental",                action: downgrade}
  - {term: "food",                  action: downgrade, notes: "food-facility sanitizing likely not CMW scope"}
  - {term: "restaurant",            action: downgrade}
  - {term: "swimming pool",         action: downgrade, notes: "pool cleaning is different; CONFIRM WITH CMW"}
  - {term: "recreational facility", action: downgrade}
  - {term: "arena",                 action: downgrade, notes: "arena floor/ice cleaning — CONFIRM WITH CMW"}
